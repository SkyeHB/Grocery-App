<!-- <p>Click the button to add a new product.</p> -->
<div class="flex">

  <mat-label class="buttonLabel">
    Click the Add New button to add a new product.
  </mat-label>

  <button mat-raised-button color="accent" id="addProductButton" routerLink="/addProduct">
    Add New
  </button>

</div>

<mat-spinner *ngIf="products.length === 0"></mat-spinner>
<table mat-table [dataSource]="currentProducts" class="mat-elevation-z8" *ngIf="products.length > 0">

  <ng-container matColumnDef="NO">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
  </ng-container>

  <ng-container matColumnDef="ID">
    <th mat-header-cell *matHeaderCellDef> ID. </th>
    <td mat-cell *matCellDef="let product"> {{product.id}} </td>
  </ng-container>

  <ng-container matColumnDef="First Name">
    <th mat-header-cell *matHeaderCellDef> Product Name </th>
    <td mat-cell *matCellDef="let product"> {{product.name}} </td>
  </ng-container>

  <ng-container matColumnDef="Category">
    <th mat-header-cell *matHeaderCellDef> Category </th>
    <td mat-cell *matCellDef="let product"> {{product.category}} </td>
  </ng-container>

  <ng-container matColumnDef="Price">
    <th mat-header-cell *matHeaderCellDef> Price </th>
    <td mat-cell *matCellDef="let product"> ${{product.price}} </td>
  </ng-container>

  <ng-container matColumnDef="Discount">
    <th mat-header-cell *matHeaderCellDef> Discount </th>
    <td mat-cell *matCellDef="let product"> {{product.discount}} </td>
  </ng-container>

  <ng-container matColumnDef="Quantity">
    <th mat-header-cell *matHeaderCellDef> Quantity </th>
    <td mat-cell *matCellDef="let product"> {{product.quantity}} </td>
  </ng-container>

  <ng-container matColumnDef="Actions">
    <th mat-header-cell *matHeaderCellDef> Actions </th>

    <td mat-cell *matCellDef="let product">

      <mat-slide-toggle [(ngModel)]="product.status"
        (click)="updateProductStatus(product.id)">Active/InActive</mat-slide-toggle>

      &nbsp;
      <button mat-raised-button color="primary" routerLink="/product-edit/{{ product.id }}">
        Edit
      </button>

    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
<br>
<mat-paginator [length]="products.length" [pageSize]="10" (page)="switchPage($event)" aria-label="Select page">
</mat-paginator>
